name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Test packages
        run: |
          for pkg in packages/*/; do
            [ -d "${pkg}test" ] || continue
            echo "::group::${pkg}"
            (cd "$pkg" && dart test)
            echo "::endgroup::"
          done
