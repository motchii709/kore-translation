name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      released: ${{ steps.check.outputs.released }}
      flutter-version: ${{ steps.check.outputs.flutter-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Compare pubspec version with existing tags
        id: check
        run: |
          version="$(yq '.version | split("+") | .[0]' pubspec.yaml)"
          released="$(git ls-remote --exit-code origin "refs/tags/v${version}" > /dev/null && echo true || echo false)"
          flutter_version="$(yq -p toml -oy '.tools.flutter.version // .tools.flutter' mise.toml)"
          {
            echo "version=${version}"
            echo "released=${released}"
            echo "flutter-version=${flutter_version}"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: check
    if: needs.check.outputs.released == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.check.outputs.flutter-version }}
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/${{ matrix.arch }}/runner/Release/* -DestinationPath "kore-${{ needs.check.outputs.version }}-windows-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: kore-*.zip

  build-android:
    name: Build Android
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.check.outputs.flutter-version }}
      - run: flutter pub get
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk "kore-${{ needs.check.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: kore-*.apk

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: check
    if: needs.check.outputs.released == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.check.outputs.flutter-version }}
      - run: flutter pub get
      - run: flutter build linux --release
      - run: |
          mv build/linux/${{ matrix.arch }}/release/bundle kore
          tar -czf "kore-${{ needs.check.outputs.version }}-linux-${{ matrix.arch }}.tar.gz" kore
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: kore-*.tar.gz

  build-macos:
    name: Build macOS
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.check.outputs.flutter-version }}
      - run: flutter pub get
      - run: flutter build macos --release
      - run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/kore translation.app" "kore-${{ needs.check.outputs.version }}-macos-universal.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: kore-*.zip

  build-ios:
    name: Build iOS (unsigned)
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ needs.check.outputs.flutter-version }}
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -qry "kore-${{ needs.check.outputs.version }}-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: kore-*.ipa

  release:
    name: Create release
    needs: [check, test, build-windows, build-android, build-linux, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: kore-*
