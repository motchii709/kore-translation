name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      released: ${{ steps.check.outputs.released }}
    steps:
      - uses: actions/checkout@v7
      - name: Compare pubspec version with existing tags
        id: check
        run: |
          version="$(yq '.version | split("+") | .[0]' pubspec.yaml)"
          released="$(git ls-remote --exit-code origin "refs/tags/v${version}" > /dev/null && echo true || echo false)"
          {
            echo "version=${version}"
            echo "released=${released}"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "kore-${{ needs.check.outputs.version }}-windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: kore-*.zip

  build-android:
    name: Build Android
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: flutter pub get
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk "kore-${{ needs.check.outputs.version }}-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: kore-*.apk

  build-linux:
    name: Build Linux
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      - uses: jdx/mise-action@v4
      - run: flutter pub get
      - run: flutter build linux --release
      - run: |
          mv build/linux/x64/release/bundle kore
          tar -czf "kore-${{ needs.check.outputs.version }}-linux-x64.tar.gz" kore
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: kore-*.tar.gz

  build-macos:
    name: Build macOS
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: flutter pub get
      - run: flutter build macos --release
      - run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/kore translation.app" "kore-${{ needs.check.outputs.version }}-macos-universal.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: kore-*.zip

  build-ios:
    name: Build iOS (unsigned)
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -qry "kore-${{ needs.check.outputs.version }}-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: kore-*.ipa

  release:
    name: Create release
    needs: [check, build-windows, build-android, build-linux, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: kore-*
