name: kore_client
description: Pure Dart translation client for kore translation, layered on llm_clients.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  llm_clients: ^0.1.0
  partial_json: ^0.1.0

dev_dependencies:
  build_runner: ^2.13.1
  dio: ^5.11.0 # tests stub the HTTP adapter
  freezed: ^3.2.5
  json_rpc_2: ^4.1.0
  json_serializable: ^6.14.1
  kore_lints: ^0.1.0
  stream_channel: ^2.1.4
  test: ^1.26.2 # resolves to a version compatible with the test_api pinned by flutter_test
