name: stdio_agent
description: Agent subprocess transport - spawns a stdio JSONL agent process and exposes it as a message channel. Carries no provider knowledge.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  async: ^2.13.1
  llm_sdk_core: ^0.1.0
  stream_channel: ^2.1.4

dev_dependencies:
  kore_lints: ^0.1.0
  test: ^1.26.2 # resolves to a version compatible with the test_api pinned by flutter_test
