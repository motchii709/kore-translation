# Shared lint configuration for pure Dart packages.
# NOTE: latest definition available in yumemi_lints 4.4.0 (Dart 3.11).
include: package:yumemi_lints/dart/3.11/recommended.yaml

formatter:
  page_width: 120

linter:
  rules:
    # The formatter is configured with page_width 120.
    lines_longer_than_80_chars: false
