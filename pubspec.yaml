name: kore_translation
description: kore translation (Kore翻訳) — LLM translation app built with Flutter. No backend, calls APIs directly.
publish_to: none
version: 0.1.6+7

environment:
  sdk: ^3.12.2
  flutter: ^3.44.8

workspace:
  - packages/kore_backends
  - packages/kore_cli
  - packages/kore_client
  - packages/kore_config
  - packages/kore_lints
  - packages/llm_sdk_acp
  - packages/llm_sdk_anthropic
  - packages/llm_sdk_codex
  - packages/llm_sdk_core
  - packages/llm_sdk_deep_seek
  - packages/llm_sdk_google
  - packages/llm_sdk_openai
  - packages/llm_sdk_openai_compatible
  - packages/partial_json
  - packages/sse
  - packages/stdio_agent

dependencies:
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  hooks_riverpod: ^3.3.2 # riverpod_annotation 4.0.3 pins riverpod 3.3.2
  intl: ^0.20.2
  kore_backends: ^0.1.0
  kore_client: ^0.1.0
  kore_config: ^0.1.0
  llm_sdk_core: ^0.1.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.3 # riverpod_generator 4.0.5 pins 4.0.3
  scroll_animator: ^0.3.0
  slang: ^4.18.0
  slang_flutter: ^4.18.0

dev_dependencies:
  build_runner: ^2.13.1 # 2.16.x conflicts with the meta version pinned by the Flutter SDK
  drift_dev: ^2.34.0
  flutter_secure_storage_platform_interface: ^2.0.2
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  go_router_builder: ^4.4.0
  json_annotation: ^4.12.0 # tests inspect CheckedFromJsonException from stored-data parses
  kore_lints: ^0.1.0
  riverpod_generator: ^4.0.4 # 4.0.6+ conflicts with freezed 3.2.x over analyzer requirements

flutter:
  uses-material-design: true
