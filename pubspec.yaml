name: kore_honyaku
description: Kore!? — LLM translation app built with Flutter. No backend, calls OpenAI-compatible APIs directly.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: ^3.44.8

workspace:
  - packages/kore_cli
  - packages/kore_client
  - packages/kore_lints

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  hooks_riverpod: ^3.3.2 # riverpod_annotation 4.0.3 が riverpod 3.3.2 を固定している
  json_annotation: ^4.12.0
  kore_client: ^0.1.0
  riverpod_annotation: ^4.0.3 # riverpod_generator 4.0.5 が 4.0.3 を固定している

dev_dependencies:
  build_runner: ^2.13.1 # 2.16 系は flutter SDK が固定する meta と衝突する
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  go_router_builder: ^4.4.0
  json_serializable: ^6.14.1
  kore_lints: ^0.1.0
  riverpod_generator: ^4.0.4 # 4.0.6+ は freezed 3.2.5 と analyzer の要求が衝突する

flutter:
  uses-material-design: true
